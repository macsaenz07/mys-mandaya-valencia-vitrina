<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b5bce" />
    <meta name="description" content="Fixi Mandados: pide transporte, acarreos y mandados en segundos y sigue a tu Fixi en el mapa, en tiempo real." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <title>Fixi Mandados</title>
    <script>
      // Tema guardado ANTES del primer pintado: sin destello de otro color al abrir.
      try {
        var p = localStorage.getItem('fixi.tema') || 'fixi', m = localStorage.getItem('tema') || 'auto', h = document.documentElement
        if (p !== 'fixi' && ['turquesa', 'azul', 'rojogris'].indexOf(p) >= 0) h.setAttribute('data-theme', p)
        if (m === 'oscuro' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) h.classList.add('dark')
      } catch (e) {}
    </script>
    <style>
      /* Pantalla de arranque (antes de que cargue la app): azul de marca con el pin de Fixi, como una app nativa. */
      #arranque { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #3b5bce; color: #f4f1ea; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .35s ease; }
      #arranque img { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 18px 40px rgb(0 0 0 / .28); animation: arranque-flota 1.8s ease-in-out infinite; }
      #arranque p { margin: 18px 0 0; text-align: center; font-weight: 800; letter-spacing: .32em; font-size: 12px; text-transform: uppercase; opacity: .9; }
      @keyframes arranque-flota { 50% { transform: translateY(-8px) } }
      @media (prefers-reduced-motion: reduce) { #arranque img { animation: none } }
    </style>
  </head>
  <body>
    <div id="arranque" aria-label="Cargando Fixi Mandados"><div><img src="/icono.svg" alt="Fixi" /><p>Mandados</p></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
